<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" fill="none">
  <defs>
    <!-- Stitch Zenith Sage Gradient -->
    <linearGradient id="h-sage-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#98a68e" />
      <stop offset="45%" stop-color="#55624d" />
      <stop offset="100%" stop-color="#3d4737" />
    </linearGradient>

    <!-- Stitch Paper / Sanctuary Background -->
    <linearGradient id="h-paper-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f2f4ed" />
    </linearGradient>

    <!-- Stitch Monogram Accent -->
    <linearGradient id="h-monogram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3529" />
      <stop offset="60%" stop-color="#434f3c" />
      <stop offset="100%" stop-color="#55624d" />
    </linearGradient>

    <!-- Subtle Ambient Shadow -->
    <filter id="h-soft-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#55624d" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Left Icon (Scaled to fit nicely in 100px height) -->
  <g transform="translate(10, 6) scale(0.88)">
    <path
      d="M50 9 L15 38.5 C13.5 39.8 13 41.4 13 43.2 L13 85 C13 89.4 16.6 93 21 93 L79 93 C83.4 93 87 89.4 87 85 L87 43.2 C87 41.4 86.5 39.8 85 38.5 L50 9 Z"
      fill="url(#h-paper-bg)"
      stroke="url(#h-sage-stroke)"
      stroke-width="4.5"
      stroke-linejoin="round"
      filter="url(#h-soft-shadow)"
    />
    <path
      d="M27 40 L50 21 L73 40"
      stroke="url(#h-sage-stroke)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-opacity="0.45"
    />
    <path
      d="M71 18 L71 27"
      stroke="url(#h-sage-stroke)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <text
      x="50"
      y="72"
      text-anchor="middle"
      fill="url(#h-monogram)"
      font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif"
      font-size="32"
      font-weight="800"
      letter-spacing="-0.8"
    >IX</text>
  </g>

  <!-- Wordmark "ImmoXus": Immo in #191c18, Xus in #55624d -->
  <text
    x="114"
    y="56"
    font-family="'Manrope', 'Plus Jakarta Sans', sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="-1.2"
    fill="#191c18"
  >Immo<tspan fill="#55624d">Xus</tspan></text>

  <!-- Official ImmoXus Slogan in Plus Jakarta Sans -->
  <text
    x="116"
    y="78"
    font-family="'Plus Jakarta Sans', sans-serif"
    font-size="12.5"
    font-weight="600"
    letter-spacing="2.2"
    fill="#757870"
    text-transform="uppercase"
  >Immobilien. Einfach. Verwalten.</text>
</svg>
